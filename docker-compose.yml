version: '3.9'

services:
  # Laravel + PHP
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: amigurumi_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - amigurumi_net

  # Node / Vite build
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: amigurumi_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    networks:
      - amigurumi_net

  # Nginx proxy
  nginx:
    image: nginx:alpine
    container_name: amigurumi_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - amigurumi_net

  # MySQL
  db:
    image: mysql:8.0
    container_name: amigurumi_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: amigurumi
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: amigurumi
      MYSQL_PASSWORD: amigurumi
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - amigurumi_net

networks:
  amigurumi_net:

volumes:
  db_data:
